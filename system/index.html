<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck System</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <form id="truckingForm" autocomplete="off">
            <h3><center>Trucking Information</center></h3>
            <input type="text" id="truckNumber" name="truckNumber" placeholder="Truck Number" required>
            <input type="text" id="driverName" name="driverName" placeholder="Driver Name" required>
            <input type="date" id="date" name="date" required>
            <b>Time Arrived</b>
            <input type="time" id="timeArrived" name="timeArrived" required>
            <b>Time Unloaded</b>
            <input type="time" id="timeProductUnloaded" name="timeProductUnloaded" required>
            <b>Time Departed</b>
            <input type="time" id="timeDeparted" name="timeDeparted" required>

            <label><b>Damages</b></label><br>
            Yes <input type="radio" name="damage" value="Yes" required>
            No <input type="radio" name="damage" value="No" required>

            <select id="shift" name="shift" required>
                <option value="">Select a shift</option>
                <option>Day Shift</option>
                <option>Afternoon Shift</option>
                <option>Night Shift</option>
            </select>

            <textarea id="comments" name="comments" rows="4" placeholder="Comments"></textarea> 

            <button type="submit">Confirm</button>
            <button type="reset" class="reset">Reset</button>
        </form>
    </div>

   <script>
document.getElementById("truckingForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData(form);

    try {
        const response = await fetch(
            "https://script.google.com/macros/s/AKfycbzIOFLYIRo0JJTrJ_zOJsvcDmXZV2kYilrN9U6FDwZRIBq3_db1NC1rLwI65GMo0Vi2/exec",
            {
                method: "POST",
                body: formData,
            }
        );

        const result = await response.text();
        console.log("Response:", result);

        if (response.ok && result.includes("success")) {
            alert("Data submitted successfully!");
            form.reset();
        } else {
            alert("Error: " + result);
        }
    } catch (error) {
        alert("Network error.");
        console.error("Submission error:", error);
    }
});
</script>
</body>
</html>
